  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const T = (abs) => abs - 11.8; // voice time → scene time
      const NNBSP = " ";
      const NBSP = " ";
      const fmtK = (v) => {
        const n = Math.round(v);
        const s = n >= 1000 ? Math.floor(n / 1000) + NNBSP + String(n % 1000).padStart(3, "0") : String(n);
        return s + NBSP + "k€";
      };
      const fmtPct = (v) => v.toFixed(1).replace(".", ",") + NBSP + "%";

      // initial states
      gsap.set("#cx-cam", { y: 0 });
      gsap.set("#cx-badge", { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" });
      gsap.set("#cx-plug", { opacity: 0, y: -30 });
      gsap.set(".cx-packet", { opacity: 0, x: 525, y: 500 });
      gsap.set([".cx-label", ".cx-value", "#cx-note"], { opacity: 0 });

      // "la connexion" (12.57): the cable runs from Sage down to the workbook
      const tCable = T(12.57);
      tl.to(["#cx-cable-out", "#cx-cable-in"], { attr: { "stroke-dashoffset": 0 }, duration: 0.7, ease: "power2.inOut" }, tCable);
      tl.to("#cx-plug", { opacity: 1, duration: 0.12, ease: "none" }, tCable + 0.6);

      // "Sage BI Reporting" (13.86): the connector badge lands on the cable
      tl.to("#cx-badge", { opacity: 1, scale: 1, duration: 0.38, ease: "back.out(1.6)" }, T(13.86) - 0.06);

      // "et Excel" (14.87): the plug snaps into the workbook, which recoils
      const tPlug = T(14.87);
      tl.to("#cx-plug", { y: 0, duration: 0.16, ease: "power3.in" }, tPlug - 0.12);
      tl.fromTo("#cx-win", { y: 0 }, { y: 10, duration: 0.08, ease: "power2.out", immediateRender: false }, tPlug + 0.04);
      tl.to("#cx-win", { y: 0, duration: 0.3, ease: "power2.out" }, tPlug + 0.12);

      // "instantanément" (16.09): data packets run down the cable
      const tRun = T(16.09);
      ["#cx-p1", "#cx-p2", "#cx-p3"].forEach((sel, i) => {
        const t0 = tRun - 0.2 + i * 0.14;
        tl.set(sel, { opacity: 1, x: 525, y: 505 }, t0);
        tl.to(sel, { y: 900, duration: 0.55, ease: "power2.in" }, t0);
        tl.set(sel, { opacity: 0 }, t0 + 0.55);
      });

      // "aux informations" (17.0 → 18.6): the camera descends from Sage to the rows
      tl.to("#cx-cam", { y: -630, duration: 1.6, ease: "power2.inOut" }, T(17.0));
      tl.set(["#cx-sage", "#cx-badge"], { opacity: 0 }, T(18.6)); // out of frame once the camera has descended

      // the four indicators land on their words; each is carried by a packet
      const rows = [
        { at: 18.94, row: "#cx-r1", val: "#cx-v1", to: 1248, fmt: fmtK, pk: "#cx-p4" },
        { at: 20.09, row: "#cx-r2", val: "#cx-v2", to: 32.4, fmt: fmtPct, pk: "#cx-p5" },
        { at: 20.57, row: "#cx-r3", val: "#cx-v3", to: 386, fmt: fmtK, pk: "#cx-p6" },
        { at: 21.36, row: "#cx-r4", val: "#cx-v4", to: 214, fmt: fmtK, pk: "#cx-p7" },
      ];
      rows.forEach((r, i) => {
        const hit = T(r.at);
        const targetY = 900 + 3 + 296 + i * 130 + 50; // cam coordinates of the row centre
        tl.set(r.pk, { opacity: 1, x: 525, y: 885 }, hit - 0.34);
        tl.to(r.pk, { x: 700, y: targetY, duration: 0.34, ease: "power2.in" }, hit - 0.34);
        tl.set(r.pk, { opacity: 0 }, hit);
        tl.fromTo(r.row + " .cx-flash", { opacity: 0.22 }, { opacity: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, hit);
        tl.fromTo(
          r.row + " .cx-label",
          { opacity: 0, filter: "blur(6px)" },
          { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power2.out", immediateRender: false },
          hit,
        );
        tl.set(r.val, { opacity: 1 }, hit);
        const counter = { v: 0 };
        tl.fromTo(
          counter,
          { v: 0 },
          {
            v: r.to,
            duration: 0.7,
            ease: "power2.out",
            immediateRender: false,
            onUpdate: () => {
              document.querySelector(r.val).textContent = r.fmt(counter.v);
            },
          },
          hit,
        );
      });
      tl.fromTo("#cx-note", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none", immediateRender: false }, T(21.6));

      tl.set({}, {}, 10.6);
      window.__timelines["connexion"] = tl;
    })();
  </script>
