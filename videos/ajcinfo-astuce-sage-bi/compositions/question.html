  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const T = (abs) => abs - 3.7; // voice time → scene time

      // initial states
      gsap.set("#qu-ul-sage", { scaleX: 0, transformOrigin: "0% 50%" });
      gsap.set("#qu-tools-b .qu-btn", { opacity: 0 });
      gsap.set(["#qu-ph-1", "#qu-ph-2", "#qu-ph-3"], { clipPath: "inset(0% 100% 0% 0%)" });
      gsap.set(["#qu-lb-1", "#qu-lb-2", "#qu-lb-3", "#qu-saisie"], { opacity: 0 });
      gsap.set(".qu-ch", { display: "none" });
      gsap.set("#qu-caret", { opacity: 0 });
      gsap.set("#qu-strike", { scaleX: 0, transformOrigin: "0% 50%" });

      // cursor: enters from below, its click on the add-in tab ignites the tab change
      const tip = (x, y) => ({ x: x - 20, y: y - 10 }); // arrow tip at 17% / 8% of 120 px
      const tTab = T(4.94);
      tl.fromTo("#qu-cursor", tip(640, 2010), { ...tip(540, 396), duration: 0.65, ease: "power3.out", immediateRender: false }, tTab - 0.8);
      gsap.set("#qu-cursor", tip(640, 2010));
      tl.to("#qu-cursor", { scale: 0.84, duration: 0.1, ease: "power2.in", transformOrigin: "17% 8%" }, tTab - 0.1);
      tl.to("#qu-cursor", { scale: 1, duration: 0.22, ease: "power2.out", transformOrigin: "17% 8%" }, tTab);
      tl.to("#qu-cursor", { ...tip(1180, 760), duration: 0.6, ease: "power2.in" }, tTab + 0.5);

      // "Sage BI Reporting" (4.94): the add-in tab becomes active
      tl.to("#qu-ul-home", { scaleX: 0, transformOrigin: "100% 50%", duration: 0.2, ease: "power3.in" }, tTab);
      tl.set("#qu-tab-home", { color: "#5b6b7a" }, tTab);
      tl.set("#qu-tab-sage", { color: "#05355e" }, tTab);
      tl.to("#qu-ul-sage", { scaleX: 1, duration: 0.32, ease: "expo.out" }, tTab);
      tl.to("#qu-tools-a", { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power2.in" }, tTab);
      tl.fromTo(
        "#qu-tools-b .qu-btn",
        { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power2.out", stagger: 0.07 },
        tTab + 0.12,
      );

      // "un tableau de bord personnalisé" (7.30): the dashboard is sketched
      const tPh = T(7.3);
      ["#qu-ph-1", "#qu-ph-2", "#qu-ph-3"].forEach((sel, i) => {
        tl.to(sel, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "power2.inOut" }, tPh + i * 0.16);
      });
      ["#qu-lb-1", "#qu-lb-2", "#qu-lb-3"].forEach((sel, i) => {
        tl.fromTo(
          sel,
          { opacity: 0, filter: "blur(6px)" },
          { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power2.out" },
          tPh + 0.42 + i * 0.16,
        );
      });

      // "dans Excel" (9.97): the Excel icon of the window answers the word
      tl.fromTo("#qu-xl", { scale: 1 }, { scale: 1.35, duration: 0.14, ease: "power2.out", transformOrigin: "50% 50%", immediateRender: false }, T(9.97));
      tl.to("#qu-xl", { scale: 1, duration: 0.3, ease: "power2.inOut" }, T(9.97) + 0.14);

      // "sans ressaisir vos données" (10.30 → 11.04): manual typing, then struck out
      const tType = T(10.3);
      tl.fromTo("#qu-saisie", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, tType - 0.05);
      tl.set("#qu-caret", { opacity: 1 }, tType);
      const chars = gsap.utils.toArray(".qu-ch");
      chars.forEach((el, i) => tl.set(el, { display: "inline" }, tType + 0.05 + i * 0.075));
      tl.set("#qu-caret", { opacity: 0 }, T(11.0));
      tl.to("#qu-strike", { scaleX: 1, duration: 0.24, ease: "power3.out" }, T(11.0));
      tl.to(["#qu-typed", "#qu-saisie"], { opacity: 0.35, duration: 0.2, ease: "power2.out" }, T(11.2));

      tl.set({}, {}, 8.1);
      window.__timelines["question"] = tl;
    })();
  </script>
