  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const T = (abs) => abs - 46.55;

      // initial states
      gsap.set("#pi-needle", { rotation: -80, svgOrigin: "0 0" });
      gsap.set(".pi-w", { opacity: 0 });
      gsap.set("#pi-logo", { opacity: 0, clipPath: "inset(0% 68.2% 0% 0%)" });
      gsap.set(".pi-chip", { opacity: 0 });

      // "vos données" (48.29): the refreshed values arrive…
      const tD = T(47.55); // during "Sage BI reporting", so they can be read before they are pulled in
      ["#pi-c1", "#pi-c2", "#pi-c3"].forEach((sel, i) => {
        tl.fromTo(sel, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out", immediateRender: false }, tD + i * 0.08);
      });
      // "…deviennent" (48.65): …and are pulled into the gauge's hub
      const hubPull = { 1: { x: 323, y: -178 }, 2: { x: 34, y: -178 }, 3: { x: -240, y: -178 } }; // chip centre → hub (540, 760)
      ["#pi-c1", "#pi-c2", "#pi-c3"].forEach((sel, i) => {
        const p = hubPull[i + 1];
        tl.to(sel, { x: p.x, y: p.y, scale: 0.3, opacity: 0, duration: 0.42, ease: "power3.in" }, T(48.65) + i * 0.08);
      });
      // the needle climbs into the teal side as the line lands on "pilotage" (50.53)
      tl.to("#pi-needle", { rotation: 58, svgOrigin: "0 0", duration: 1.55, ease: "power3.inOut" }, T(49.0));
      gsap.utils.toArray(".pi-tick").forEach((el, i) => {
        tl.to(el, { attr: { stroke: "#469d98" }, duration: 0.12, ease: "none" }, T(49.0) + 0.25 + i * 0.13);
      });
      // the claim, word by word on the voice (it leaves when the gauge becomes the logo)
      const words = gsap.utils.toArray(".pi-w");
      [49.08, 49.22, 49.86, 50.21, 50.53].forEach((at, i) => {
        tl.fromTo(
          words[i],
          { opacity: 0, filter: "blur(6px)" },
          { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power2.out", immediateRender: false },
          T(at),
        );
      });

      // "À bientôt" (51.15): the gauge becomes the AJCinfo mark
      const tM = T(51.15);
      tl.to(["#pi-ticks", "#pi-needle", "#pi-hub"], { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, tM - 0.05);
      // the claim leaves before the logo lands: the end card carries only the logo (client's call)
      tl.to("#pi-claim", { opacity: 0, filter: "blur(8px)", duration: 0.25, ease: "power2.in" }, tM + 0.1);
      tl.to("#pi-mark", { attr: { transform: "translate(301.2 760.4) scale(0.33847)" }, duration: 0.9, ease: "power3.inOut" }, tM);
      tl.to("#pi-arc-o", { attr: { "stroke-dasharray": "270 90", "stroke-dashoffset": -90 }, duration: 0.9, ease: "power3.inOut" }, tM);
      tl.to("#pi-arc-m", { attr: { "stroke-dasharray": "270 90" }, duration: 0.75, ease: "power3.inOut" }, tM + 0.12);
      tl.to("#pi-arc-i", { attr: { "stroke-dasharray": "270 90" }, duration: 0.7, ease: "power3.inOut" }, tM + 0.2);
      // match onto the real logo, then the name wipes in
      const tL = tM + 0.9;
      tl.to("#pi-logo", { opacity: 1, duration: 0.1, ease: "none" }, tL);
      tl.to("#pi-mark", { opacity: 0, duration: 0.1, ease: "none" }, tL + 0.05);
      tl.to("#pi-logo", { clipPath: "inset(0% 0% 0% 0%)", duration: 0.65, ease: "power3.out" }, tL + 0.08);

      tl.set({}, {}, 8.45);
      window.__timelines["pilotage"] = tl;
    })();
  </script>
