  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const T = (abs) => abs - 39.85;

      // slices: manipulations (m), erreurs (e), analyse (a), in % of the ring; 1-point gaps
      const S = { m: 44, e: 24, a: 29 };
      const draw = () => {
        const m = S.m,
          e = S.e,
          a = S.a;
        document.getElementById("be-s-m").setAttribute("stroke-dasharray", m + " " + (100 - m));
        document.getElementById("be-s-m").setAttribute("stroke-dashoffset", "0");
        document.getElementById("be-s-e").setAttribute("stroke-dasharray", e + " " + (100 - e));
        document.getElementById("be-s-e").setAttribute("stroke-dashoffset", String(-(m + 1)));
        document.getElementById("be-s-a").setAttribute("stroke-dasharray", a + " " + (100 - a));
        document.getElementById("be-s-a").setAttribute("stroke-dashoffset", String(-(m + e + 2)));
      };
      draw();
      gsap.set("#be-world", { clipPath: "circle(0px at 540px 640px)" });
      gsap.set("#be-sticker", { opacity: 0, scale: 0.6, transformOrigin: "50% 100%" });
      gsap.set("#be-illu", { scale: 0.86 });

      // "moins de manipulations" (39.98)
      tl.to(S, { m: 14, duration: 0.8, ease: "power3.inOut", onUpdate: draw }, T(40.05));
      // "moins de risques d'erreurs" (41.27)
      tl.to("#be-slot-in", { y: -96, duration: 0.4, ease: "power3.inOut" }, T(41.2));
      tl.to(S, { e: 8, duration: 0.8, ease: "power3.inOut", onUpdate: draw }, T(41.3));
      // "plus de temps pour analyser" (42.68): analysis takes the freed time
      tl.to("#be-slot-in", { y: -192, duration: 0.4, ease: "power3.inOut" }, T(42.6));
      tl.to(S, { a: 76, duration: 0.9, ease: "power3.inOut", onUpdate: draw }, T(42.7));

      // "analyser votre activité" (43.61): push through the ring into the human side
      const tI = T(43.62);
      tl.to("#be-center", { opacity: 0, duration: 0.15, ease: "power2.in" }, tI);
      tl.to("#be-ring", { scale: 7.5, filter: "blur(10px)", transformOrigin: "50% 50.5%", duration: 0.65, ease: "power3.in" }, tI);
      tl.to("#be-ring", { opacity: 0, duration: 0.65, ease: "power2.in" }, tI); // the ground shows through, so the ring must go
      tl.to("#be-slot", { y: 260, opacity: 0, duration: 0.4, ease: "power3.in" }, tI);
      tl.to("#be-world", { clipPath: "circle(1400px at 540px 640px)", duration: 0.65, ease: "power3.in" }, tI);
      tl.fromTo("#be-illu", { scale: 0.86 }, { scale: 1, duration: 1.2, ease: "expo.out", immediateRender: false }, tI + 0.2); // keeps the push going

      // "votre activité … prendre" (44.4 → 45.3): the camera aims at the target
      tl.fromTo("#be-illu-cam", { scale: 1 }, { scale: 1.12, transformOrigin: "800px 412px", duration: 0.9, ease: "power2.inOut", immediateRender: false }, T(44.4));
      // "les bonnes décisions" (45.06)
      tl.to("#be-sticker", { opacity: 1, scale: 1, duration: 0.36, ease: "back.out(1.6)" }, T(45.06));
      tl.to("#be-leader-path", { attr: { "stroke-dashoffset": 0 }, duration: 0.35, ease: "power2.out" }, T(45.06) + 0.15);

      tl.set({}, {}, 6.7);
      window.__timelines["benefices"] = tl;
    })();
  </script>
