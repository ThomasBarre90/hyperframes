  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const T = (abs) => abs - 22.4; // voice time → scene time
      const tip = (x, y) => ({ x: x - 20, y: y - 10 });
      const WX = 63; // window inner origin (abs)
      const WY = 273;

      // ---------- initial states ----------
      gsap.set("#ge-cam", { scale: 1, transformOrigin: "588px 479px" });
      gsap.set("#ge-cursor", tip(700, 2010));
      gsap.set("#ge-sel", { opacity: 1, clipPath: "inset(0% 100% 100% 0%)" });
      gsap.set([".ge-tile", ".ge-in", "#ge-bars-label", ".ge-month"], { opacity: 0 });
      gsap.set(".ge-bar", { opacity: 0, scaleY: 0, transformOrigin: "50% 100%" });
      gsap.set(".ge-packet", { opacity: 0, x: 525, y: -40 });

      // rows → tiles: each tile starts on the rect of its row
      const rowRect = (i) => ({ x: 10, y: 300 + i * 130, w: 814, h: 122 });
      const tiles = [
        { sel: "#ge-t1", row: 0, x: 24, y: 312, w: 776, h: 216 },
        { sel: "#ge-t3", row: 1, x: 416, y: 544, w: 384, h: 156 },
        { sel: "#ge-t4", row: 2, x: 416, y: 716, w: 384, h: 156 },
        { sel: "#ge-t4b", row: 3, x: 416, y: 716, w: 384, h: 156 },
      ];
      tiles.forEach((t) => {
        const r = rowRect(t.row);
        gsap.set(t.sel, { x: r.x - t.x, y: r.y - t.y, scaleX: r.w / t.w, scaleY: r.h / t.h, transformOrigin: "0% 0%" });
      });

      // ---------- "sélectionner vos données" (23.25) ----------
      tl.fromTo("#ge-cursor", tip(700, 2010), { ...tip(WX + 22, WY + 312), duration: 0.65, ease: "power3.out", immediateRender: false }, 0.2);
      const tPress = T(23.25) - 0.1;
      tl.to("#ge-cursor", { scale: 0.84, duration: 0.1, ease: "power2.in", transformOrigin: "17% 8%" }, tPress);
      tl.to("#ge-cursor", { ...tip(WX + 816, WY + 806), duration: 0.9, ease: "power2.inOut" }, tPress + 0.1);
      tl.to("#ge-sel", { clipPath: "inset(0% 0% 0% 0%)", duration: 0.9, ease: "power2.inOut" }, tPress + 0.1);
      tl.to("#ge-cursor", { scale: 1, duration: 0.22, ease: "power2.out", transformOrigin: "17% 8%" }, tPress + 1.0);

      // ---------- "construire vos indicateurs" (24.61): a click rebuilds the rows as tiles ----------
      const tClick1 = T(24.45);
      tl.to("#ge-cursor", { scale: 0.84, duration: 0.1, ease: "power2.in", transformOrigin: "17% 8%" }, tClick1);
      tl.to("#ge-cursor", { scale: 1, duration: 0.22, ease: "power2.out", transformOrigin: "17% 8%" }, tClick1 + 0.1);
      const tMorph = tClick1 + 0.1;
      tl.to("#ge-sel", { opacity: 0, duration: 0.25, ease: "power2.out" }, tMorph);
      tl.to(["#ge-rows .ge-label", "#ge-rows .ge-value", "#ge-note"], { opacity: 0, filter: "blur(6px)", duration: 0.15, ease: "power2.in" }, tMorph);
      tiles.forEach((t, i) => {
        tl.set(t.sel, { opacity: 1 }, tMorph);
        tl.to(t.sel, { x: 0, y: 0, scaleX: 1, scaleY: 1, duration: 0.7, ease: "power3.inOut" }, tMorph + i * 0.06);
      });
      tl.to("#ge-cursor", { ...tip(1250, 1180), duration: 0.55, ease: "power2.in" }, tMorph + 0.15); // leaves the frame
      gsap.utils.toArray(".ge-in").forEach((el, i) => {
        if (el.id === "ge-spark" || el.id === "ge-donut") return;
        tl.fromTo(
          el,
          { opacity: 0, filter: "blur(6px)" },
          { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power2.out", immediateRender: false },
          tMorph + 0.62 + i * 0.067,
        );
      });

      // ---------- "et vos graphiques" (26.21) ----------
      const tCharts = T(26.21);
      tl.set("#ge-t2", { opacity: 1, clipPath: "inset(100% 0% 0% 0%)" }, tCharts - 0.08);
      tl.to("#ge-t2", { clipPath: "inset(0% 0% 0% 0%)", duration: 0.45, ease: "power3.out" }, tCharts - 0.08);
      tl.fromTo("#ge-bars-label", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power2.out", immediateRender: false }, tCharts + 0.12);
      gsap.utils.toArray(".ge-bar").forEach((el, i) => {
        tl.set(el, { opacity: 1 }, tCharts + 0.12 + i * 0.07);
        tl.to(el, { scaleY: 1, duration: 0.6, ease: "expo.out" }, tCharts + 0.12 + i * 0.07);
      });
      tl.to(".ge-month", { opacity: 1, duration: 0.2, ease: "none" }, tCharts + 0.2);
      tl.set(["#ge-spark", "#ge-donut"], { opacity: 1 }, tCharts);
      tl.to("#ge-spark-line", { attr: { "stroke-dashoffset": 0 }, duration: 0.6, ease: "power2.inOut" }, tCharts + 0.05);
      tl.to("#ge-donut-arc", { attr: { "stroke-dasharray": "32.4 100" }, duration: 0.7, ease: "power2.inOut" }, tCharts + 0.1);

      // ---------- "puis d'actualiser" (27.98): back to the button, the camera leans in ----------
