      tl.to("#re-check", { attr: { "stroke-dashoffset": 0 }, duration: 0.3, ease: "power2.out" }, tF + 0.12);

      // "toujours à jour" (36.04): the arcs turn once, the chip says it
      const tJ = T(36.04);
      tl.fromTo("#re-chip-icon", { rotation: 0, svgOrigin: "0 0" }, { rotation: 360, svgOrigin: "0 0", duration: 0.7, ease: "power2.inOut", immediateRender: false }, tJ - 0.1);

      // "un gain de temps" (37.30): the stopwatch of the opening, run fast
      const tG = T(37.3);
      tl.to("#re-gain", { clipPath: "inset(0% 0% 0% 0%)", duration: 0.4, ease: "power3.out" }, tG - 0.15);
