<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #ffffff;
    }
    /* Minimal gradient ground (client v4): a near-white wash with AJCinfo-coloured glows drifting slowly. */
    #gr-base {
      position: absolute;
      inset: 0;
      background: linear-gradient(172deg, #ffffff 0%, #f5fafa 52%, #eaf4f3 100%);
    }
    #gr-glows {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
    }
    .gr-glow {
      position: absolute;
      border-radius: 50%;
    }
    /* v5: firmer cores and shorter falloff, so the glows read as shapes rather than haze */
    .gr-teal {
      background: radial-gradient(circle closest-side, rgba(70, 157, 152, 0.56) 0%, rgba(70, 157, 152, 0.44) 38%, rgba(70, 157, 152, 0.18) 64%, rgba(70, 157, 152, 0) 82%);
    }
    .gr-navy {
      background: radial-gradient(circle closest-side, rgba(10, 71, 117, 0.3) 0%, rgba(10, 71, 117, 0.22) 38%, rgba(10, 71, 117, 0.08) 64%, rgba(10, 71, 117, 0) 82%);
    }
    /* a whisper of grain so the soft gradients do not band once encoded */
    #gr-grain {
      position: absolute;
      inset: 0;
      opacity: 0.05;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 1 0'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>");
    }
  </style>
  <div id="root" data-composition-id="ground" data-width="1080" data-height="1920">
    <div id="gr-base" data-layout-ignore></div>
    <div id="gr-glows" data-layout-ignore data-layout-allow-overflow>
      <div class="gr-glow gr-teal" id="gr-g1" style="left: 360px; top: -60px; width: 980px; height: 980px"></div>
      <div class="gr-glow gr-navy" id="gr-g2" style="left: -480px; top: 640px; width: 1100px; height: 1100px"></div>
      <div class="gr-glow gr-teal" id="gr-g3" style="left: -200px; top: 1560px; width: 960px; height: 960px"></div>
      <div class="gr-glow gr-navy" id="gr-g4" style="left: 560px; top: 1440px; width: 900px; height: 900px"></div>
      <div class="gr-glow gr-teal" id="gr-g5" style="left: 220px; top: 2300px; width: 980px; height: 980px"></div>
    </div>
    <div id="gr-grain" data-layout-ignore></div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      gsap.set("#gr-glows", { y: 0 });

      // Drift (v5: faster and wider): each glow travels seven eased legs across the film (deterministic, no loops).
      const drift = [
        { el: "#gr-g1", path: [ [-220, 160, 1.12], [120, 300, 0.92], [-160, 40, 1.15], [180, 220, 0.95], [-120, 340, 1.1], [200, 80, 0.94], [-60, 200, 1.08] ] },
        { el: "#gr-g2", path: [ [300, -140, 1.1], [80, 200, 0.94], [360, 60, 1.14], [120, -180, 0.96], [340, 160, 1.1], [60, -40, 0.92], [260, 120, 1.12] ] },
        { el: "#gr-g3", path: [ [260, -160, 0.92], [460, 120, 1.12], [180, -60, 0.96], [420, 200, 1.1], [220, -120, 0.94], [480, 40, 1.12], [300, -20, 1.0] ] },
        { el: "#gr-g4", path: [ [-220, 180, 1.1], [-420, -80, 0.94], [-160, 120, 1.14], [-380, 260, 0.96], [-200, -40, 1.1], [-440, 140, 0.92], [-260, 60, 1.08] ] },
        { el: "#gr-g5", path: [ [240, -220, 1.12], [-180, -60, 0.94], [200, -300, 1.1], [-140, -160, 0.96], [260, -80, 1.14], [-100, -260, 0.92], [120, -140, 1.06] ] },
      ];
      drift.forEach((d) => {
        gsap.set(d.el, { x: 0, y: 0, scale: 1, transformOrigin: "50% 50%" });
        const seg = 55 / d.path.length;
        d.path.forEach((p, k) => {
          tl.to(d.el, { x: p[0], y: p[1], scale: p[2], duration: seg, ease: "sine.inOut" }, k * seg);
        });
      });

      // The glows also descend a little with every seam (a quarter of the content's travel),
      // so the film still reads as one camera going down.
      let y = 0;
      function upSeam(cut) {
        y -= 57.6;
        tl.to("#gr-glows", { y: y, duration: 0.34, ease: "power3.in" }, cut - 0.34);
        y -= 48;
        tl.to("#gr-glows", { y: y, duration: 0.42, ease: "power4.out" }, cut);
      }
      function pan(start, dist, dur) {
        y -= dist;
        tl.to("#gr-glows", { y: y, duration: dur, ease: "power2.inOut" }, start);
      }
      upSeam(3.7); // hook → question
      upSeam(11.8); // question → connexion
      pan(17.0, 157, 1.6); // connexion: camera descends from Sage to the rows
      upSeam(39.85); // resultat → benefices
      upSeam(46.55); // benefices → pilotage
      tl.set({}, {}, 55);
      window.__timelines["ground"] = tl;
    })();
  </script>
</template>
